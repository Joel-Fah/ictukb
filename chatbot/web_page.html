<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ICT University Assistant</title>
<style>
  :root {
    --bg: #f7f8fa; --surface: #ffffff; --surface-2: #f1f3f6; --text: #1b2230; --muted: #667085; --faint: #98a2b3;
    --border: #e3e7ee; --accent: #2457d6; --accent-soft: #e9effd; --accent-text: #ffffff;
    --ok: #12805c; --ok-soft: #e4f5ee; --warn: #a15c07; --warn-soft: #fdf3e2; --none: #475467; --none-soft: #eef1f5;
    --err: #b42318; --err-soft: #fdecea; --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 4px 16px rgba(16, 24, 40, .06);
    --radius: 14px; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216; --surface: #171b21; --surface-2: #1e232b; --text: #e7eaf0; --muted: #a2abba; --faint: #6c7686;
      --border: #2a3039; --accent: #7aa2ff; --accent-soft: #1c2742; --accent-text: #0b1020;
      --ok: #4cc38a; --ok-soft: #13291f; --warn: #f0b155; --warn-soft: #2c2213; --none: #a8b3c4; --none-soft: #1f252e;
      --err: #ff8a80; --err-soft: #2e1717; --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 20px rgba(0, 0, 0, .35);
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }  /* otherwise display:flex rules win over the hidden attribute */
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); display: flex; flex-direction: column;
         font: 15px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
         -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  svg { display: block; }

  /* Top bar */
  .top { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 85%, transparent);
         backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
  .top-in { max-width: 820px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 10px; }
  .mark { width: 30px; height: 30px; border-radius: 9px; background: var(--accent); color: var(--accent-text);
          display: grid; place-items: center; font-weight: 700; font-size: 12px; letter-spacing: .5px; }
  .brand { font-weight: 650; }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted);
          border: 1px solid var(--border); border-radius: 999px; padding: 2px 9px; background: var(--surface); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
  .spacer { flex: 1; }
  .icon-btn { border: 1px solid transparent; background: transparent; border-radius: 9px; padding: 6px 8px;
              display: inline-flex; align-items: center; gap: 6px; color: var(--muted); cursor: pointer; font-size: 13px; }
  .icon-btn:hover { background: var(--surface-2); color: var(--text); }

  /* Conversation */
  #scroller { flex: 1; overflow-y: auto; scroll-behavior: smooth; }
  #log { max-width: 820px; margin: 0 auto; padding: 18px 16px 24px; }
  .empty { text-align: center; padding: 9vh 0 10px; }
  .empty h1 { font-size: 26px; margin: 0 0 6px; letter-spacing: -.3px; }
  .empty p { color: var(--muted); margin: 0 auto 26px; max-width: 520px; }
  .suggest { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; text-align: left; }
  .suggest button { border: 1px solid var(--border); background: var(--surface); border-radius: 12px; padding: 12px 14px;
                    cursor: pointer; display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
                    text-align: left; transition: border-color .15s, transform .15s; }
  .suggest button:hover { border-color: var(--accent); transform: translateY(-1px); }
  .suggest .k { font-size: 12px; color: var(--faint); }
  @media (max-width: 560px) { .suggest { grid-template-columns: 1fr; } }

  .msg { margin: 22px 0; animation: in .18s ease-out; }
  @keyframes in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .meta { font-size: 12px; color: var(--faint); display: flex; align-items: center; gap: 8px; }
  .user { display: flex; flex-direction: column; align-items: flex-end; }
  .bubble { background: var(--accent-soft); border-radius: 16px 16px 4px 16px; padding: 9px 14px; max-width: 78%;
            white-space: pre-wrap; overflow-wrap: anywhere; }
  .user .meta { margin-top: 4px; }

  .bot { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; }
  .bot .mark { width: 30px; height: 30px; font-size: 11px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow);
          overflow: hidden; }
  .card-head { display: flex; align-items: center; gap: 8px; padding: 9px 14px 0; flex-wrap: wrap; }
  .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; border-radius: 999px;
           padding: 2px 9px; }
  .badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .b-grounded { color: var(--ok); background: var(--ok-soft); }
  .b-check { color: var(--warn); background: var(--warn-soft); }
  .b-not_found { color: var(--none); background: var(--none-soft); }
  .b-error { color: var(--err); background: var(--err-soft); }
  .b-stopped { color: var(--none); background: var(--none-soft); }
  .b-live { color: var(--accent); background: var(--accent-soft); }
  .b-live::before { animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .25; } }

  .answer { padding: 8px 16px 14px; overflow-wrap: anywhere; }
  .answer p { margin: 0 0 10px; }
  .answer p:last-child, .answer ul:last-child, .answer ol:last-child { margin-bottom: 0; }
  .answer ul, .answer ol { margin: 0 0 10px; padding-left: 22px; }
  .answer li { margin: 3px 0; }
  .cite { display: inline-block; font: 600 11px/1 var(--mono); color: var(--accent); background: var(--accent-soft);
          border-radius: 6px; padding: 3px 5px; margin: 0 2px; vertical-align: 1px; text-decoration: none; }
  .cite:hover { text-decoration: none; filter: brightness(.95); }
  .removed { font-size: 12px; color: var(--err); background: var(--err-soft); border-radius: 6px; padding: 1px 6px; }
  .caret { display: inline-block; width: 7px; height: 1.05em; background: var(--accent); vertical-align: -2px;
           margin-left: 2px; animation: pulse .9s infinite; border-radius: 1px; }
  .progress { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 14px; padding: 12px 16px 14px; }
  .spinner { width: 15px; height: 15px; border: 2px solid var(--border); border-top-color: var(--accent);
             border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .timer { font: 12px var(--mono); color: var(--faint); margin-left: auto; }

  /* Below the answer: behaviour, sources, metrics */
  .panel { border-top: 1px solid var(--border); background: var(--surface-2); padding: 10px 14px 12px;
           display: flex; flex-direction: column; gap: 10px; }
  .callout { border-radius: 10px; padding: 8px 12px; font-size: 13px; }
  .callout ul { margin: 2px 0 0; padding-left: 18px; }
  .callout b { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .4px; }
  .c-check { background: var(--warn-soft); color: var(--warn); }
  .c-not_found { background: var(--none-soft); color: var(--none); }
  .c-contacts { background: var(--surface); border: 1px solid var(--border); color: var(--text); white-space: pre-wrap; }
  .label { font-size: 11px; font-weight: 650; color: var(--faint); text-transform: uppercase; letter-spacing: .5px;
           margin-bottom: 6px; }
  .sources { display: flex; flex-wrap: wrap; gap: 8px; }
  .src { display: flex; gap: 9px; align-items: flex-start; background: var(--surface); border: 1px solid var(--border);
         border-radius: 10px; padding: 7px 10px; max-width: 100%; color: var(--text); font-size: 13px; }
  .src:hover { border-color: var(--accent); text-decoration: none; }
  .src .n { font: 600 11px/1.9 var(--mono); color: var(--accent); }
  .src .t { font-weight: 600; line-height: 1.35; }
  .src .s { font-size: 12px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .src code { font: 11px var(--mono); color: var(--faint); }
  .tag { font-size: 11px; border-radius: 5px; padding: 0 5px; }
  .tag-draft { color: var(--warn); background: var(--warn-soft); }
  .tag-stale { color: var(--err); background: var(--err-soft); }
  .tag-uncited { color: var(--none); background: var(--none-soft); }
  .src.flash { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

  .metrics { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .m { font: 12px var(--mono); border-radius: 7px; padding: 2px 8px; background: var(--surface);
       border: 1px solid var(--border); color: var(--muted); }
  .m b { font-weight: 600; color: var(--text); }
  .m-ok { border-color: color-mix(in srgb, var(--ok) 45%, var(--border)); }
  .m-ok b { color: var(--ok); }
  .m-warn { border-color: color-mix(in srgb, var(--warn) 45%, var(--border)); }
  .m-warn b { color: var(--warn); }
  .m-none b { color: var(--none); }
  details summary { cursor: pointer; font-size: 12px; color: var(--muted); list-style: none; display: inline-flex;
                    align-items: center; gap: 4px; }
  details summary::-webkit-details-marker { display: none; }
  details summary::before { content: "›"; display: inline-block; transition: transform .15s; }
  details[open] summary::before { transform: rotate(90deg); }
  .passages { margin-top: 8px; display: grid; gap: 5px; }
  .pas { display: grid; grid-template-columns: 52px 90px minmax(0, 1fr); gap: 8px; align-items: center; font-size: 12px; }
  .pas .v { font-family: var(--mono); }
  .bar { height: 6px; border-radius: 3px; background: var(--border); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
  .pas.unused { opacity: .55; }
  .pas .h { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
  .pas code { font: 11px var(--mono); color: var(--text); }
  .actions { display: flex; gap: 4px; margin-left: auto; }
  .actions .icon-btn { padding: 3px 6px; font-size: 12px; }

  /* Composer */
  .composer { padding: 6px 16px 14px; background: linear-gradient(to top, var(--bg) 70%, transparent); }
  .composer-in { max-width: 820px; margin: 0 auto; position: relative; }
  .box { display: flex; align-items: flex-end; gap: 8px; background: var(--surface); border: 1px solid var(--border);
         border-radius: 18px; padding: 8px 8px 8px 16px; box-shadow: var(--shadow); transition: border-color .15s; }
  .box:focus-within { border-color: var(--accent); }
  textarea { flex: 1; border: 0; outline: 0; resize: none; background: transparent; color: var(--text);
             font: inherit; line-height: 24px; padding: 6px 0; max-height: 200px; overflow-y: hidden; min-height: 36px; }
  textarea::placeholder { color: var(--faint); }
  textarea:focus-visible { outline: none; }  /* the surrounding box shows focus */
  .send { width: 36px; height: 36px; border-radius: 12px; border: 0; background: var(--accent); color: var(--accent-text);
          display: grid; place-items: center; cursor: pointer; flex: none; transition: opacity .15s, transform .1s; }
  .send:active { transform: scale(.96); }
  .send:disabled { opacity: .35; cursor: default; }
  .send.stop { background: var(--text); color: var(--bg); }
  .hint { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--faint); padding: 6px 6px 0; }
  .count.near { color: var(--warn); }
  .latest { position: absolute; left: 50%; top: -46px; transform: translateX(-50%); border: 1px solid var(--border);
            background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 12px; cursor: pointer;
            box-shadow: var(--shadow); display: none; }
  .latest.show { display: block; }
  @media (max-width: 560px) {
    .brand { font-size: 14px; white-space: nowrap; }
    #model { display: none; }
    .icon-btn .lbl { display: none; }
    .bubble { max-width: 88%; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div class="top">
  <div class="top-in">
    <div class="mark" aria-hidden="true">IU</div>
    <div class="brand">ICT University Assistant</div>
    <span class="pill" id="model"><span class="dot"></span>Local</span>
    <span class="spacer"></span>
    <button class="icon-btn" id="new" type="button" title="Start a new conversation" aria-label="New chat">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      <span class="lbl">New chat</span>
    </button>
  </div>
</div>

<div id="scroller">
  <div id="log" aria-live="polite"></div>
</div>

<div class="composer">
  <div class="composer-in">
    <button class="latest" id="latest" type="button">↓ Latest</button>
    <form class="box" id="form">
      <textarea id="q" rows="1" maxlength="500" placeholder="Ask about admissions, fees, ERP… / Posez votre question…"
                aria-label="Your question"></textarea>
      <button class="send" id="send" type="submit" aria-label="Send" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </form>
    <div class="hint"><span>Enter to send · Shift+Enter for a new line</span><span class="count" id="count"></span></div>
  </div>
</div>

<template id="empty-tpl">
  <div class="empty">
    <h1>Ask about ICT University</h1>
    <p>Admissions, fees, registration, the ERP, exams and more. Answers come only from the university's knowledge
       base, with their sources, and run entirely on this computer.</p>
    <div class="suggest">
      <button type="button"><span>How do I register for courses?</span><span class="k">Procedures</span></button>
      <button type="button"><span>Can I pay my fees in installments?</span><span class="k">Finance</span></button>
      <button type="button"><span>I forgot my ERP password. What do I do?</span><span class="k">ERP</span></button>
      <button type="button"><span>When are the exams?</span><span class="k">Timetables</span></button>
      <button type="button"><span>Comment payer les frais de scolarité ?</span><span class="k">Français</span></button>
      <button type="button"><span>What documents do I need for a Bachelor application?</span><span class="k">Admissions</span></button>
    </div>
  </div>
</template>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const log = $("log"), scroller = $("scroller"), q = $("q"), send = $("send"), form = $("form");
const MAX = 500;
const ICON_SEND = send.innerHTML;
const ICON_STOP = '<svg width="14" height="14" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2.5" fill="currentColor"/></svg>';
const STATUS = {
  grounded: "Grounded in sources", check: "Check this answer", not_found: "Not in the knowledge base",
  stopped: "Stopped", error: "Error", live: "Answering",
};
let busy = null;   // {controller} while an answer is being written
let follow = true; // auto-scroll only while the reader is at the bottom

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
const time = () => new Date().toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"});

/* ---------- composer ---------- */
function resize() {
  q.style.height = "auto";
  const h = Math.min(q.scrollHeight, 200);
  q.style.height = h + "px";
  q.style.overflowY = q.scrollHeight > 200 ? "auto" : "hidden";  // a scrollbar only once the box is at full height
}
function updateComposer() {
  resize();
  const n = q.value.length;
  $("count").textContent = n > MAX - 100 ? `${n}/${MAX}` : "";
  $("count").classList.toggle("near", n > MAX - 30);
  if (!busy) send.disabled = !q.value.trim();
}
q.addEventListener("input", updateComposer);
q.addEventListener("focus", resize);
window.addEventListener("resize", resize);  // wrapping (and so the height) changes with the width
q.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); form.requestSubmit(); }
});
form.addEventListener("submit", (e) => {
  e.preventDefault();
  if (busy) { busy.controller.abort(); return; }
  const question = q.value.trim();
  if (!question) return;
  q.value = ""; updateComposer();
  ask(question);
});
function setBusy(b) {
  busy = b;
  send.innerHTML = b ? ICON_STOP : ICON_SEND;
  send.classList.toggle("stop", !!b);
  send.setAttribute("aria-label", b ? "Stop" : "Send");
  send.disabled = b ? false : !q.value.trim();
}

/* ---------- scrolling ---------- */
scroller.addEventListener("scroll", () => {
  follow = scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 80;
  $("latest").classList.toggle("show", !follow && !!busy);
});
function stick() { if (follow) scroller.scrollTop = scroller.scrollHeight; }
$("latest").addEventListener("click", () => { follow = true; stick(); $("latest").classList.remove("show"); });

/* ---------- empty state / new chat ---------- */
function showEmpty() {
  log.replaceChildren($("empty-tpl").content.cloneNode(true));
  log.querySelectorAll(".suggest button").forEach((b) => b.addEventListener("click", () => {
    q.value = b.firstElementChild.textContent; updateComposer(); q.focus();
  }));
}
$("new").addEventListener("click", () => { if (busy) busy.controller.abort(); showEmpty(); q.focus(); });

/* ---------- rendering the answer (text only, never HTML from the server) ---------- */
const CITE = /\[([a-z0-9]+(?:-[a-z0-9]+)+)\]/g;
const REMOVED = /\[(contact removed[^\]]*|coordonnée retirée[^\]]*)\]/g;
const LINK = /https?:\/\/[^\s\])>]+/g;
const BOLD = /\*\*([^*]+)\*\*/g;

function inline(parent, text, refs) {
  // tokens: citations, removed-contact markers, links, bold; everything else is plain text
  const re = new RegExp([CITE.source, REMOVED.source, LINK.source, BOLD.source].map((s) => `(${s})`).join("|"), "g");
  let last = 0, prevCite = null;
  for (const m of text.matchAll(re)) {
    const before = text.slice(last, m.index);
    if (before.trim()) prevCite = null;
    parent.append(before);
    const tok = m[0];
    if (tok.startsWith("**")) {
      parent.append(el("strong", "", tok.slice(2, -2))); prevCite = null;
    } else if (/^https?:/.test(tok)) {
      const url = tok.replace(/[.,;:]+$/, ""); const a = el("a", "", url);
      a.href = url; a.target = "_blank"; a.rel = "noopener noreferrer"; parent.append(a, tok.slice(url.length));
      prevCite = null;
    } else if (REMOVED.test(tok)) {
      REMOVED.lastIndex = 0; parent.append(el("span", "removed", tok.slice(1, -1)));
    } else {
      const id = tok.slice(1, -1);
      if (prevCite === id) { last = m.index + tok.length; continue; }   // "[a] [a] [a]" → one chip
      prevCite = id;
      const n = refs ? refs.indexOf(id) + 1 : 0;
      const chip = el("a", "cite", n ? String(n) : id);
      chip.title = id;
      chip.href = "#";
      chip.dataset.id = id;
      parent.append(chip);
    }
    last = m.index + tok.length;
  }
  parent.append(text.slice(last));
}

function renderAnswer(box, text, refs, live) {
  box.replaceChildren();
  const blocks = text.replace(/\r/g, "").trim().split(/\n\s*\n/);
  const kind = (l) => (/^\s*[-*•]\s+/.test(l) ? "ul" : /^\s*\d+[.)]\s+/.test(l) ? "ol" : "p");
  for (const block of blocks) {
    // Consecutive lines of the same kind form one paragraph or one list ("intro:\n- a\n- b" = p + ul).
    let current = null, currentKind = null;
    for (const line of block.split("\n").filter((l) => l.trim())) {
      const k = kind(line);
      if (k !== currentKind) { current = el(k); currentKind = k; box.append(current); }
      if (k === "p") {
        if (current.childNodes.length) current.append(el("br"));
        inline(current, line, refs);
      } else {
        const li = el("li"); inline(li, line.replace(/^\s*([-*•]|\d+[.)])\s+/, ""), refs); current.append(li);
      }
    }
  }
  if (live) (box.lastElementChild || box).append(el("span", "caret"));
}

/* ---------- message construction ---------- */
function userMessage(text) {
  const wrap = el("div", "msg user");
  wrap.append(el("div", "bubble", text), el("div", "meta", time()));
  return wrap;
}

function botMessage() {
  const wrap = el("div", "msg bot");
  const mark = el("div", "mark", "IU"); mark.setAttribute("aria-hidden", "true");
  const card = el("div", "card");
  const head = el("div", "card-head");
  const badge = el("span", "badge b-live", STATUS.live);
  const stamp = el("span", "meta", time());
  const actions = el("div", "actions");
  head.append(badge, stamp, actions);
  const progress = el("div", "progress");
  const label = el("span", "", "Searching the knowledge base…");
  const timer = el("span", "timer", "0.0 s");
  progress.append(el("span", "spinner"), label, timer);
  const answer = el("div", "answer"); answer.hidden = true;
  card.append(head, progress, answer);
  wrap.append(mark, card);
  const t0 = performance.now();
  const tick = setInterval(() => { timer.textContent = ((performance.now() - t0) / 1000).toFixed(1) + " s"; }, 100);
  return {wrap, card, badge, label, progress, answer, actions, stop: () => clearInterval(tick)};
}

function setStatus(m, status) {
  m.badge.className = "badge b-" + status;
  m.badge.textContent = STATUS[status];
}

function metricChip(label, value, tone) {
  const c = el("span", "m" + (tone ? " m-" + tone : ""));
  c.append(label + " "); c.append(el("b", "", value));
  return c;
}

function panel(m, turn) {
  const p = el("div", "panel");
  if (turn.reasons.length && turn.status !== "grounded") {
    const c = el("div", "callout c-" + turn.status);
    c.append(el("b", "", turn.status === "check" ? "Worth checking" : "Why no answer"));
    const ul = el("ul"); turn.reasons.forEach((r) => ul.append(el("li", "", r))); c.append(ul);
    p.append(c);
  }
  if (turn.contacts) p.append(el("div", "callout c-contacts", turn.contacts));
  if (turn.sources.length) {
    const box = el("div");
    box.append(el("div", "label", turn.sources.some((s) => s.cited) ? "Sources" : "Sources given to the model (not cited)"));
    const list = el("div", "sources");
    turn.sources.forEach((s, i) => {
      const a = el("a", "src"); a.href = s.url; a.target = "_blank"; a.rel = "noopener noreferrer"; a.dataset.id = s.id;
      const body = el("div");
      body.append(el("div", "t", s.title));
      const sub = el("div", "s");
      sub.append(el("code", "", s.id), "verified " + s.last_verified);
      if (s.draft) sub.append(el("span", "tag tag-draft", "draft"));
      if (s.stale) sub.append(el("span", "tag tag-stale", "may be outdated"));
      if (!s.cited) sub.append(el("span", "tag tag-uncited", "not cited"));
      body.append(sub);
      a.append(el("span", "n", String(i + 1)), body);
      list.append(a);
    });
    box.append(list); p.append(box);
  }
  const x = turn.metrics, metrics = el("div", "metrics");
  const margin = x.best_similarity - x.threshold;
  metrics.append(metricChip("match", x.best_similarity.toFixed(2), margin >= 0.05 ? "ok" : margin >= 0 ? "warn" : "none"));
  metrics.append(metricChip("search", x.retrieval_ms + " ms"));
  if (turn.used_llm) {
    metrics.append(metricChip("first words", x.first_token_s + " s", x.first_token_s <= 10 ? "ok" : x.first_token_s <= 25 ? "warn" : "none"));
    metrics.append(metricChip("total", x.total_s + " s"));
    if (x.answer_tok_s) metrics.append(metricChip("speed", x.answer_tok_s + " tok/s"));
    if (x.prompt_tokens) metrics.append(metricChip("prompt", x.prompt_tokens + " tok"));
  } else {
    metrics.append(metricChip("model", "not called", "none"));
  }
  const det = el("details"); det.append(el("summary", "", `${turn.passages.length} passages retrieved`));
  const pas = el("div", "passages");
  for (const s of turn.passages) {
    const row = el("div", "pas" + (s.used ? "" : " unused"));
    const bar = el("div", "bar"), fill = el("i");
    fill.style.width = Math.max(4, Math.min(100, (s.similarity - 0.7) / 0.25 * 100)) + "%"; bar.append(fill);
    const h = el("div", "h"); h.append(el("code", "", s.id), "  " + (s.heading || "") + (s.used ? "" : " (not given to the model)"));
    row.append(el("span", "v", s.similarity.toFixed(3)), bar, h);
    pas.append(row);
  }
  det.append(pas);
  const row = el("div"); row.append(metrics); p.append(row, det);
  m.card.append(p);
}

function copyButton(m, getText) {
  const b = el("button", "icon-btn", "Copy"); b.type = "button";
  b.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(getText()); b.textContent = "Copied"; }
    catch { b.textContent = "Copy failed"; }
    setTimeout(() => { b.textContent = "Copy"; }, 1500);
  });
  m.actions.append(b);
}

/* ---------- asking ---------- */
async function ask(question) {
  if (log.querySelector(".empty")) log.replaceChildren();
  log.append(userMessage(question));
  const m = botMessage(); log.append(m.wrap);
  follow = true; stick();
  const controller = new AbortController(); setBusy({controller});
  let text = "", turn = null;
  try {
    const res = await fetch("/api/ask", {method: "POST", headers: {"Content-Type": "application/json"},
                                         body: JSON.stringify({question}), signal: controller.signal});
    if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.error || res.statusText); }
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const {value, done} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      let nl;
      while ((nl = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, nl); buf = buf.slice(nl + 1);
        if (!line) continue;
        const ev = JSON.parse(line);
        if (ev.t === "retrieval") {
          m.label.textContent = ev.fallback
            ? "Nothing close enough in the knowledge base…"
            : `Found ${ev.passages} passages (best match ${ev.best.toFixed(2)}) · writing the answer…`;
        } else if (ev.t === "text") {
          text += ev.v;
          m.progress.hidden = true; m.answer.hidden = false;
          renderAnswer(m.answer, text, null, true);
        } else if (ev.t === "done") {
          turn = ev.turn;
        } else if (ev.t === "error") {
          throw new Error(ev.v);
        }
      }
      stick();
    }
    m.stop(); m.progress.hidden = true; m.answer.hidden = false;
    if (!turn) throw new Error("the answer was interrupted");
    const refs = turn.sources.map((s) => s.id);
    renderAnswer(m.answer, text, refs, false);
    setStatus(m, turn.status);
    panel(m, turn);
    copyButton(m, () => text.trim());
    m.answer.querySelectorAll(".cite").forEach((c) => c.addEventListener("click", (e) => {
      e.preventDefault();
      const card = m.card.querySelector(`.src[data-id="${CSS.escape(c.dataset.id)}"]`);
      if (card) { card.scrollIntoView({block: "nearest"}); card.classList.add("flash"); setTimeout(() => card.classList.remove("flash"), 1200); }
    }));
  } catch (err) {
    m.stop(); m.progress.hidden = true;
    if (controller.signal.aborted) {
      setStatus(m, "stopped");
      if (text) { m.answer.hidden = false; renderAnswer(m.answer, text, null, false); }
      else { m.answer.hidden = false; m.answer.replaceChildren(el("p", "", "Stopped before the answer started.")); }
    } else {
      setStatus(m, "error");
      m.answer.hidden = false;
      if (text) renderAnswer(m.answer, text, null, false); else m.answer.replaceChildren();
      const c = el("div", "callout c-check", "Something went wrong: " + err.message + ". ");
      const retry = el("button", "icon-btn", "Try again"); retry.type = "button";
      retry.addEventListener("click", () => ask(question));
      c.append(retry); m.answer.append(c);
    }
  } finally {
    setBusy(null); stick(); $("latest").classList.remove("show"); q.focus();
  }
}

fetch("/api/info").then((r) => r.json()).then((i) => {
  $("model").replaceChildren(el("span", "dot"), `Local · ${i.model}`);
  $("model").title = `${i.top_k} passages per question, similarity threshold ${i.threshold}`;
}).catch(() => {});
showEmpty(); updateComposer(); q.focus();
</script>
